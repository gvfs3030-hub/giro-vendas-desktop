name: Build Windows App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Patch react-native-fs (conserto do codegen-windows)
        run: node tools/patch-rnfs.js

      - name: Diagnostico do codegen na biblioteca de arquivos
        continue-on-error: true
        working-directory: node_modules/@dr.pogodin/react-native-fs
        run: npx --yes @react-native-community/cli codegen-windows --logging

      - name: Generate native Windows project
        run: npx react-native init-windows --overwrite

      - name: Build Release (x64)
        run: npx react-native run-windows --arch x64 --release --no-launch --no-deploy --no-packager --logging --msbuildprops WindowsTargetPlatformVersion=10.0

      - name: List build output (debug helper)
        if: always()
        shell: pwsh
        run: |
          if (Test-Path windows) {
            Get-ChildItem -Recurse windows | Select-Object FullName | Format-Table -AutoSize
          } else {
            Write-Host "Pasta windows/ não foi criada."
          }

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GiroVendasDesktop-Windows-x64
          path: |
            windows/**/*.exe
            windows/**/*.dll
            windows/**/*.pri
            windows/**/*.winmd
            windows/**/Bundle/**
            windows/**/AppPackages/**
          if-no-files-found: warn
          retention-days: 14
